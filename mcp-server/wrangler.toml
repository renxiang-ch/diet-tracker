name = "diet-tracker-mcp"
main = "src/index.ts"
compatibility_date = "2026-07-19"
compatibility_flags = ["nodejs_compat"]

[[durable_objects.bindings]]
name = "MCP_OBJECT"
class_name = "DietTrackerMCP"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DietTrackerMCP"]

[[kv_namespaces]]
binding = "OAUTH_KV"
id = "REPLACE_WITH_KV_NAMESPACE_ID"
